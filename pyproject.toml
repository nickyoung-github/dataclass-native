[project]
name = "dataclass-native"
description = "Python dataclasses as a data description language, stored in generated C++ (and later Rust) structs"
authors = [
    {name = "Nick Young", email = "nick.young.github@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: OS Independent"
]

dynamic = ["version"]

dependencies = [
    "jinja2>=3.1.6",
]

[project.scripts]
dataclass-native = "dataclass_native.cli:main"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# The version is that of the latest tag, e.g. v1.2.3
[tool.setuptools_scm]
version_file = "src/dataclass_native/_version.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataclass_native = [
    "py.typed",
    "include/dataclass_native/*.hpp",
    "backends/templates/*.j2",
    "cmake/*.cmake",
]

[dependency-groups]
dev = [
    "cmake>=4.4.5",
    "msgpack>=1.2.4",
    "nanobind>=3.1.0",
    "pre-commit>=4.7.0",
    "pydantic>=2.14.4",
    "pyright>=1.1.414",
    "pytest",
    "pytest-cov",
    "ruff>=0.17.5",
]

[tool.pyright]
include = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Instances of frozen dataclasses are immutable, so are fine as defaults
"tests/schemas/*" = ["RUF009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The schema modules used by the tests are imported as the top-level package "schemas"
pythonpath = ["tests"]

[tool.coverage.run]
source = ["dataclass_native"]
branch = true
# The modes other than pure are tested in processes of their own
patch = ["subprocess"]
omit = ["*/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
